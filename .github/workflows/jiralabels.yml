name: Ensure GH PRs have a corresponding JIRA issue

on:
  pull_request:
    types: [opened, edited, synchronize] # synchronize during dev

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-url:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: ${{ github.event.pull_request.base.label }} # not quite. it's e.g. jmtd:ubi9
    steps:
      - name: Check for required URI pattern
        id: check_uri
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          URIPAT:  "https://issues.redhat.com/browse/OPENJDK-"
        run: |
          if echo "$PR_BODY" | grep -q "$URIPAT"; then
            echo "missing=false" >> $GITHUB_OUTPUT
          else
            echo "missing=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply label if URI missing
        if: steps.check_uri.outputs.missing == 'true'
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs-jira-issue"

      - name: Remove label if URI present
        if: steps.check_uri.outputs.missing == 'false'
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "needs-jira-issue"

      - name: Add branch label if missing
        run: gh pr edit --add-label "$LABEL"
