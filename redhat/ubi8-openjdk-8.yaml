konflux:
  repository:
    uri: git@gitlab.cee.redhat.com:openjdk/openjdk-container-konflux.git
    ref: openjdk-els-8-rhel8
  rpms.in.yaml:
    contentOrigin:
      repofiles: ['./ubi.repo']
    arches:
      - x86_64
      - aarch64
      - ppc64le
      - s390x
    installWeakDeps: false
    moduleEnable:
    - "maven:3.8"
    reinstallPackages:
    - tzdata
